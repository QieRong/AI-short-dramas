# Agnes API 适配层配置
# ==============================
# 安全要求：本文件不含任何密钥，可安全提交。
# API Key 从环境变量 AGNES_API_KEY 读取，绝不落盘。

# 站点选择: "cn" = 中国站, "intl" = 国际站
# 注：密钥与站点绑定，两站不互通。当前密钥为国际站签发，故用 intl。
site: "intl"

sites:
  cn:
    base_url: "https://api.agnes-ai.cn/v1"
  intl:
    base_url: "https://apihub.agnes-ai.com/v1"

# 模型 ID
models:
  text: "agnes-3.0-flash"
  image: "agnes-image-2.5-flash"
  video: "agnes-video-2.5-flash"

# 文本模型参数
text:
  temperature: 0.8
  max_tokens: 4096
  timeout: 120

# 图像模型参数
image:
  size: "1024x1024"
  timeout: 180

# 视频模型参数（依据 agnes-video-2.5-flash 官方 schema 修正）
# 注：Flash 的 size 固定为 "720P"，画幅由 aspect_ratio 决定；
#     时长字段是 seconds（字符串 "4"-"12"），不存在 duration 字段。
video:
  size: "720P"
  aspect_ratio: "9:16"     # 竖屏短剧；输出分辨率 720x1280
  seconds: "5"
  timeout: 600             # 单次请求超时
  poll_interval: 5         # 轮询间隔（秒）
  max_poll_attempts: 120   # 最大轮询次数 ≈ 10 分钟
  create_interval: 45      # 两次「创建任务」之间的最小间隔（秒），规避免费层 429

# 项目路径约定
paths:
  bible: "00_bible"
  outline: "01_outline"
  scripts: "02_scripts"
  storyboard: "03_storyboard"
  assets: "04_assets"
  final: "05_final"
